<!doctype html>
<html lang="ca-ES-valencia">
  <body style="font-family: system-ui, sans-serif; color: #2b2822; line-height: 1.5;">
    <h2 style="color: #4a7016;">Benvinguda a l'Observatori Ciutadà de l'Horta</h2>
    <p>Per a crear el teu compte des de la web, obri este enllaç en el mateix navegador on l'has demanat:</p>
    <p><a href="{{ .ConfirmationURL }}">Confirma i entra</a></p>
    <p>Si estàs en l'app, escriu este codi:</p>
    <p style="font-size: 1.75rem; font-weight: 700; letter-spacing: 0.2em;">{{ .Token }}</p>
    <p style="color: #5c584f; font-size: 0.875rem;">Si no ho has demanat tu, pots ignorar este correu: no es crearà cap compte.</p>
  </body>
</html>
